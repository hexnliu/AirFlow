
{%  extends 'accounts/account/account.html' %}

{% load static %}
{% block content %}
<br>
<br>
    <h1 class="mb-3 fw-normal">Password Reset</h1>
   <form id="password_resetForm" method="post" class="mt-3 border p-3 text-left rounded bg-white  needs-validation" novalidate>
    {% csrf_token %}
    <p class="text-muted small">Forgot your password? Enter your email address below, and we'll email instructions for setting a new one.</p>
    <div class="form-row">
      <label for="id_email" class="text-primary small">Email</label>
      <input type="email" name="email" autocomplete="email" maxlength="254" required id="id_email" class="form-control" placeholder="Email">
         <div class="invalid-feedback">
           <i class="fa fa-circle" ></i> Invalid Email Address
        </div>
    </div>
    <button class="w-100 btn btn-lg  mt-3" style="background-color: #055ba6;color: white;" type="submit">Reset my password</button>
  </form>
{%endblock%}
