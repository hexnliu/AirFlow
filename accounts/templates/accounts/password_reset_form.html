
{%  extends 'accounts/account/account.html' %}

{% load static %}
{% block content %}
  <h1 class="h3 mb-3 fw-normal">Enter new password</h1>
  <form method="post" class="mt-3 border p-3 text-left rounded bg-white" style="width:350px;">
    {% csrf_token %}
    <p class="small text-muted">Please enter your new password twice so we can verify you typed it in correctly.</p>

    <div class="form-row">
      <label for="id_password1" class="small">Password</label>
      <input type="password"  class="form-control" name="new_password1" autocomplete="new-password" required="" id="id_password1"  placeholder="New Password">
       <div class="invalid-feedback">
            <i class="fa fa-circle" ></i>Password is required<br>
      </div>
    </div>

    <div class="form-row">
      <label for="id_password2" class="small mt-3">Re-enter Password</label>
      <input type="password" class="form-control" name="new_password2" autocomplete="new-password" required="" id="id_password2"  placeholder="New Password Confirmation">
        <div class="invalid-feedback">
          <i class="fa fa-circle" ></i> Password does not match
      </div>
    </div>

    <button class="w-100 btn btn-lg  mt-3" type="submit" style="background-color: #055ba6;color: white;">Change my password</button>

  </form>
{%endblock%}
