
{% comment %} 
This is the select building modal for any navigation
Useage: 
context: buildings - all buildings from the user's company
local variable: url_name - url link eg. /buildings/detail_building/

{% endcomment %}
<div class="modal fade" id="{{p_name}}Modal" data-backdrop="static" data-keyboard="false" tabindex="-1"
  aria-labelledby="{{p_name}}ModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <p class="modal-title h5" id="{{p_name}}ModalTitle">Building
          </p>
          <button type="button" class="close " data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          
          <select name="id" class="form-control"  onchange="if (this.value) window.location.href=this.value">
            <option selected>Choose...</option>
            {% for b in buildings%}
              <option value="{{url_name}}{{b.id}}" onclick="">{{b.name}}</option>
            {%endfor%}
          </select>

        </div>
      </div>
    </div>
  </div>
