<div class="form-group">
    <label for="{{value.id}}_stat_{{count}}" class="mb-2 mr-sm-2 font-weight-bold">Select Min, Max, Mean, or
      Median</label>
    <select class="form-control form-control-sm mb-3 mr-sm-3" class="{{value.id}}_stat_{{count}}" name="statistic"
      required>
      <option value="">Please Choose</option>
      <option value="Minimum">Minimum (lowest)</option>
      <option value="Maximum">Maximum (highest)</option>
      <option value="Mean">Mean (average)</option>
      <option value="Median">Median (middle)</option>
    </select>
  </div>
