<div class="modal fade" id="msgModal" data-backdrop="static" data-keyboard="false" tabindex="-1"
  aria-labelledby="msgModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content rounded-0">
        <div class="modal-header border-0">
          <p class="modal-title h5" id="msgModalTitle">Error

          </p>
          <button type="button" class="close " data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <p class="text-danger">The following sensors are missing some required values.</p>
          <div id="error_list">

          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" data-dismiss="modal">Go Back</button>
          {% comment %} <button type="button" id="btnPlacementErrors" class="btn btn-primary">Proceed Anyway</button> {% endcomment %}
        </div>
      </div>
    </div>
  </div>
