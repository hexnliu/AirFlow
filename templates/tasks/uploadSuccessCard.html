{% comment %} This is the successful message for upload tasks {% endcomment %}
<div id="uploadSuccessCard" class="modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body p-5">
          <span class="material-icons align-middle text-success float-left mr-4" style="font-size:50px;"> check_circle </span>
          <h6>{{message}} </h6>
          {% if building%}
             <a href="/tasks/view_task/{{building.id}}" class="btn btn-primary mt-5">Go Back to Tasks<a>
          {%else%}
            <a href="#" onclick="window.location.reload();" class="btn btn-primary mt-5">Refresh <a>
          {%endif%}
        </div>
      </div>
    </div>
  </div>
