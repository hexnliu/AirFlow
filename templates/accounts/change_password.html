
{%  extends 'accounts/account/account.html' %}

{% load static %}
{% block content %}
  <h1 class="h3 mb-3 fw-normal">Change Password</h1>
  <form method="POST" action="{% url 'account_change_password' %}" class="mt-3 border p-3 text-left rounded bg-white needs-validation" novalidate>
    {% csrf_token %}
    <div class="form-row">
       <label for="id_old_password" class="small">Old Password</label>
        {% if form.old_password.errors%}
          <input type="password" class="form-control is-invalid"  name="old_password" autocomplete="current-password" placeholder="Old Password" autofocus="" id="id_old_password" required >
           <div class="invalid-feedback">
                <i class="fa fa-circle" ></i>{{ form.old_password.errors.as_text }}<br>
          </div>
        {%else%}
          <input type="password" class="form-control"  name="old_password" autocomplete="current-password" placeholder="Old Password" autofocus="" id="id_old_password"  required>
           <div class="invalid-feedback">
                <i class="fa fa-circle" ></i>Password is required<br>
          </div>
        {%endif%}

      </div>

    <div class="form-row">
      <label for="id_password1" class="small">New Password</label>
      <input type="password"  class="form-control" name="new_password1" autocomplete="new-password" required="" id="id_password1"  placeholder="New Password">
       <div class="invalid-feedback">
            <i class="fa fa-circle" ></i>Password is required<br>
      </div>
    </div>




    <div class="form-row">
      <label for="id_password2" class="small mt-3">Re-enter New Password</label>
      <input type="password" class="form-control" name="new_password2" autocomplete="new-password" required="" id="id_password2"  placeholder="New Password Confirmation">
        <div class="invalid-feedback">
          <i class="fa fa-circle" ></i> Password does not match
      </div>
    </div>

    <button class="w-100 btn btn-lg mt-3" type="submit" style="background-color: #055ba6;color: white;" name="action" >Submit</button>

  </form>
{%endblock%}
