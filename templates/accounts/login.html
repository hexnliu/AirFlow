

{%  extends 'accounts/account.html'  %}

{% load static %}
{% block content %}
<br>
<br>
  <form  method="POST" action="" class="mt-3 border p-3 text-left rounded bg-white needs-validation" novalidate>
    {% csrf_token %}
    <div class="form-row">
      <label for="inputUsername" class="small">Username</label>
        <input type="text" id="inputUsername" name="username" class="form-control" placeholder="Username" required autofocus="">
       <div class="invalid-feedback">
           <i class="fa fa-circle" ></i>  Username is required
        </div>
    </div>

    <div class="form-row">
      <label for="inputPassword" class="small">Password</label>
        <input type="password" id="inputPassword" name="password" class="form-control" placeholder="Password" required>
       <div class="invalid-feedback">
           <i class="fa fa-circle" ></i>  Password is required
        </div>
    </div>
      {%if error%}
      <div class="alert alert-danger p-2 mt-3" role="alert">{{error}}</div>
      {%endif%}
      <br/>
      
      <input type="checkbox" required name="checkbox" value="check" id="agree" /><label style="font-size:12px;margin-top:auto;color:black" >&nbsp; I accept the&nbsp;<a href="#raModal" data-toggle="modal" >End User Licence Agreement. </a></label>

      <div class="invalid-feedback">
        <i class="fa fa-circle" ></i>  Please accept End User Licence Agreement.
     </div>
      <button class="w-100 btn btn-lg btn-primary mt-3" type="submit" style="background-color: #055ba6;color: white;">Login</button>
      <style>
        input#agree {
            width: 10px;
            height: 10px;
        }
    </style>
  </form>
  <p class="mt-mb-3 font-weight-bold"><a href="{% url 'reset_password' %}">Forgot password?</a></p>
{%endblock%}
