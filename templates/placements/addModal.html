{% comment %}
 This add location modal that is using ajax to post data
 all ids are with prefix: {{p_name}}_

 local variable:
 p_name: id 
 link: where to post to
 
 {% endcomment %}
<div id="{{p_name}}Modal" class="modal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Location</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-body">
                    <div class="container">
                        <form id="{{p_name}}Form" action="{{link}}" method="POST" class="needs-validation" novalidate>
                            <div class="form-group row">
                                <label for="{{p_name}}_name" class="col-sm-3 col-form-label">Name</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control form-control-sm" id="{{p_name}}_name"
                                        name="name" required/>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label for="{{p_name}}_description" class="col-sm-3 col-form-label">Description</label>
                                <div class="col-sm-9">
                                    <textarea rows="2" class="form-control form-control-sm" name="description" id="{{p_name}}_description" required></textarea>
                                </div>
                            </div>
                            <div class="form-group row">
                                <label for="{{p_name}}_notes" class="col-sm-3 col-form-label">Notes</label>
                                <div class="col-sm-9">
                                    <textarea rows="2" class="form-control form-control-sm" name="notes" id="{{p_name}}_description"></textarea>
                                </div>
                            </div>
                             <input type="hidden" id="{{p_name}}_company" name="company" value="{{task.building.company.id}}" >
          
                            <button type="submit" class="float-right btn btn-primary" id="{{p_name}}_saveBtn" >Save</button>
                        </form>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
