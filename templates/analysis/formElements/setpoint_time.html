<div class="form-group">
    <label for="{{value.id}}_sp_start_{{count}}" class="mb-2 mr-sm-2 font-weight-bold">Set Point Start Time</label>
    <input type="time" class="form-control" name="sp_start" value="" id="{{value.id}}_sp_start_{{count}}" required>
    <div class="invalid-feedback">
      Please Input a Value
    </div>

    <label for="{{value.id}}_sp_end_{{count}}" class="mb-2 mr-sm-2 font-weight-bold">Set Point End Time</label>
    <input type="time" class="form-control" name="sp_end" value="" id="{{value.id}}_sp_end_{{count}}" required>
    <div class="invalid-feedback">
        Please Input a Value
    </div>
  </div>

{% comment %} <div class="form-group">
    
  </div> {% endcomment %}
