 <div class="form-group">
    <label for="{{value.id}}_days_{{count}}" class="mb-2 mr-sm-2 font-weight-bold">Days</label>
    <select class="form-control form-control-sm mb-3 mr-sm-3 select2-multiple" id="{{value.id}}_days_{{count}}"  multiple="multiple" name="days[]"
      required>
      <option value="">Please Choose</option>
      <option value="Mon">Mon</option>
      <option value="Tue">Tue</option>
      <option value="Wed">Wed</option>
      <option value="Thu">Thu</option>
      <option value="Fri">Fri</option>
      <option value="Sat">Sat</option>
      <option value="Sun">Sun</option>
    </select>
  </div>
