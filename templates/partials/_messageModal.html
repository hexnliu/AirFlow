<div class="modal fade" id="{{p_name}}Modal" data-backdrop="static" data-keyboard="false" tabindex="-1"
  aria-labelledby="{{p_name}}ModalTitle" aria-hidden="true">
  {%if size == 'large'%}
  <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
    {%else%}
    <div class="modal-dialog modal-dialog-centered" role="document">
      {%endif%}

      <div class="modal-content rounded-0">
        <div class="modal-header border-0">
          <p class="modal-title h5" id="{{p_name}}ModalTitle">{{title}}

          </p>
          <button type="button" class="close " data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          {%if p_name == "viewFloorPlanMarker"%}

          <div id="zoom-marker-div" class="zoom-marker-div">
            <img class="zoom-marker-img" style="top:0px;" id="zoom-marker-alt" alt="..." name="viewArea" draggable="false" />
          </div>
          {%endif%}

        </div>
      </div>
    </div>
  </div>
