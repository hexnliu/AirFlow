<div class="modal" id="settingsModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Settings</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close" onclick="closeSettings('{{company_user}}');">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <form action ="/companies/settings/" method="POST">
            <div class="custom-control custom-switch">
                {%if company_user == True %}
                    <input type="checkbox" name="notification" checked="true" class="custom-control-input" id="customSwitch1">
                {%else%}
                <input type="checkbox" name="notification"  class="custom-control-input" id="customSwitch1">
                {%endif%}
                <label class="custom-control-label" for="customSwitch1">Notification</label>
            </div>
           <form>
        </div>
        <div class="modal-footer">
          <button type="button" onclick="closeSettings('{{company_user}}');" class="btn btn-secondary" data-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-primary">Update</button>
        </div>
      </div>
    </div>
  </div>
